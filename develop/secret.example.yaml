# Copy to develop/secret.yaml and replace every example value before deploying.
# JWT_SECRET must be Base64-encoded and decode to at least 32 random bytes.
apiVersion: v1
kind: Secret
metadata:
  name: employee-service-secret
type: Opaque
stringData:
  DB_USERNAME: "replace-with-database-username"
  DB_PASSWORD: "replace-with-database-password"
  API_USERNAME: "replace-with-api-username"
  API_PASSWORD: "replace-with-api-password"
  JWT_SECRET: "replace-with-base64-encoded-random-key"
